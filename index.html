<!DOCTYPE html>
<html>
<head>
    <title>Candaş Uniform</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        h1 { color: #333; }
        
        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 8px;
        }
        
        button:hover { background-color: #0056b3; }
        
        #photoPreview {
            max-width: 250px;
            margin: 20px auto;
            display: none;
            border-radius: 10px;
        }
        
        #uniformButtons { display: none; margin-top: 20px; }
        #result { display: none; margin-top: 30px; }
        #resultCanvas { max-width: 100%; border: 2px solid #ddd; border-radius: 10px; }
        #adjustControls { display: none; margin-top: 20px; }
        
        .control-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        
        .control-btn {
            min-width: 50px;
            font-size: 20px;
            background-color: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
        }
        
        .control-btn:hover { background-color: #e0e0e0; }
        
        input[type="file"] { padding: 10px; margin: 20px; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Candaş Uniform</h1>
        <div>
            <h2>Шаг 1: Загрузите ваше фото</h2>
            <input type="file" id="photoInput" accept="image/*">
            <br>
            <img id="photoPreview">
        </div>
        <div id="uniformButtons">
            <h2>Шаг 2: Выберите одежду</h2>
            <button onclick="tryOnUniform('medical_coat')">🥼 Медицинский халат</button>
            <button onclick="tryOnUniform('medical_top')">👔 Медицинский верх</button>
            <button onclick="tryOnUniform('medical_pants')">👖 Медицинские брюки</button>
        </div>
        <div id="result">
            <h2>Результат примерки</h2>
            <canvas id="resultCanvas"></canvas>
            <br>
            <button onclick="savePhoto()">💾 Сохранить фото</button>
            <button onclick="resetApp()">🔄 Начать заново</button>
            <div id="adjustControls">
                <h3>Подгонка одежды</h3>
                <div class="control-row">
                    <button class="control-btn" onclick="adjustSize(0.1)">+</button>
                    <button class="control-btn" onclick="adjustSize(-0.1)">–</button>
                    <span style="min-width: 80px;">Размер</span>
                </div>
                <div class="control-row">
                    <button class="control-btn" onclick="moveUniform(0, -10)">↑</button>
                    <button class="control-btn" onclick="moveUniform(-10, 0)">←</button>
                    <button class="control-btn" onclick="moveUniform(10, 0)">→</button>
                    <button class="control-btn" onclick="moveUniform(0, 10)">↓</button>
                    <span>Сдвиг</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        let userPhoto = null;
        let currentUniform = '';
        let scaleFactor = 1;
        let offsetX = 0;
        let offsetY = 0;

        document.getElementById('photoInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                userPhoto = new Image();
                userPhoto.src = e.target.result;
                userPhoto.onload = function() {
                    const preview = document.getElementById('photoPreview');
                    preview.src = userPhoto.src;
                    preview.style.display = 'block';
                    document.getElementById('uniformButtons').style.display = 'block';
                    document.getElementById('result').style.display = 'none';
                    document.getElementById('adjustControls').style.display = 'none';
                };
            };
            reader.readAsDataURL(file);
        });

        function tryOnUniform(type) {
            if (!userPhoto) { alert('Сначала загрузите фото!'); return; }
            currentUniform = type;
            scaleFactor = 1;
            offsetX = 0;
            offsetY = 0;
            drawResult();
            document.getElementById('result').style.display = 'block';
            document.getElementById('adjustControls').style.display = 'block';
        }

        function drawResult() {
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = userPhoto.width;
            canvas.height = userPhoto.height;
            ctx.drawImage(userPhoto, 0, 0);
            drawMedicalClothing(ctx, currentUniform, scaleFactor, offsetX, offsetY);
        }

        function adjustSize(delta) {
            scaleFactor = Math.max(0.3, Math.min(2.5, scaleFactor + delta));
            drawResult();
        }

        function moveUniform(dx, dy) {
            offsetX += dx;
            offsetY += dy;
            drawResult();
        }

        function drawMedicalClothing(ctx, type, scale, offX, offY) {
            const canvas = document.getElementById('resultCanvas');
            const width = canvas.width;
            const height = canvas.height;
            if (type === 'medical_coat') drawCoat(ctx, width, height, scale, offX, offY);
            else if (type === 'medical_top') drawTop(ctx, width, height, scale, offX, offY);
            else if (type === 'medical_pants') drawPants(ctx, width, height, scale, offX, offY);
        }

        // Халат (пока рисованный)
        function drawCoat(ctx, width, height, scale, offX, offY) {
            const w = width * 0.55 * scale;
            const h = height * 0.55 * scale;
            const x = (width - w) / 2 + offX;
            const y = height * 0.20 + offY;
            ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#F0F0F0'; ctx.fillRect(x + w*0.05, y, w*0.1, h); ctx.fillRect(x + w*0.85, y, w*0.1, h);
            ctx.fillStyle = '#E8E8E8';
            ctx.beginPath(); ctx.moveTo(x + w*0.30, y); ctx.lineTo(x + w*0.50, y + h*0.10); ctx.lineTo(x + w*0.70, y); ctx.lineTo(x + w*0.50, y + h*0.05); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#F5F5F5';
            ctx.beginPath(); ctx.moveTo(x + w*0.30, y); ctx.lineTo(x + w*0.38, y + h*0.35); ctx.lineTo(x + w*0.50, y + h*0.10); ctx.closePath(); ctx.fill();
            ctx.beginPath(); ctx.moveTo(x + w*0.70, y); ctx.lineTo(x + w*0.62, y + h*0.35); ctx.lineTo(x + w*0.50, y + h*0.10); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#CCCCCC';
            for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(x + w/2, y + h*(0.18 + i*0.15), 5, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#999'; ctx.lineWidth = 1; ctx.stroke(); }
            ctx.fillStyle = '#E0E0E0'; ctx.fillRect(x, y + h*0.70, w, 10);
            ctx.strokeStyle = '#D0D0D0'; ctx.lineWidth = 2; ctx.strokeRect(x + w*0.12, y + h*0.40, w*0.22, h*0.16);
            ctx.fillStyle = '#333'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.fillText('Медицинский халат', width/2, y + h + 40);
        }

        // Верх (используем вашу блузу coat.png)
        function drawTop(ctx, width, height, scale, offX, offY) {
            const img = new Image();
            img.src = 'coat.png';
            img.onload = function() {
                const w = img.width * scale * 0.7;
                const h = img.height * scale * 0.7;
                const x = (width - w) / 2 + offX;
                const y = height * 0.25 + offY;
                ctx.drawImage(img, x, y, w, h);
                ctx.fillStyle = '#333';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Медицинский верх', width/2, y + h + 40);
            };
        }

        // Брюки (пока рисованные)
        function drawPants(ctx, width, height, scale, offX, offY) {
            const w = width * 0.35 * scale;
            const h = height * 0.50 * scale;
            const x = (width - w) / 2 + offX;
            const y = height * 0.45 + offY;
            ctx.fillStyle = '#E8F4FD'; ctx.fillRect(x - w*0.25, y, w*0.55, h);
            ctx.fillStyle = '#E8F4FD'; ctx.fillRect(x + w*0.70, y, w*0.55, h);
            ctx.fillStyle = '#D0E8F8'; ctx.fillRect(x - w*0.25, y, w*0.15, h); ctx.fillRect(x + w*0.70, y, w*0.15, h);
            ctx.fillStyle = '#B8D8F0'; ctx.fillRect(x - w*0.25, y, w*1.50, h*0.08);
            ctx.fillStyle = '#333'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.fillText('Медицинские брюки', width/2, y + h + 40);
        }

        function savePhoto() {
            const canvas = document.getElementById('resultCanvas');
            const link = document.createElement('a');
            link.download = 'candas_uniform.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function resetApp() {
            userPhoto = null;
            currentUniform = '';
            scaleFactor = 1;
            offsetX = 0;
            offsetY = 0;
            document.getElementById('photoInput').value = '';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('uniformButtons').style.display = 'none';
            document.getElementById('result').style.display = 'none';
            document.getElementById('adjustControls').style.display = 'none';
        }
    </script>
</body>
</html>
