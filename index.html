<!DOCTYPE html>
<html>
<head>
    <title>Candaş Uniform</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
        }
        
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 10px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        #photoPreview {
            max-width: 250px;
            margin: 20px auto;
            display: none;
            border-radius: 10px;
        }
        
        #uniformButtons {
            display: none;
            margin-top: 20px;
        }
        
        #result {
            display: none;
            margin-top: 30px;
        }
        
        #resultCanvas {
            max-width: 100%;
            border: 2px solid #ddd;
            border-radius: 10px;
        }
        
        input[type="file"] {
            padding: 10px;
            margin: 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Candaş Uniform</h1>
        
        <div>
            <h2>Шаг 1: Загрузите ваше фото</h2>
            <input type="file" id="photoInput" accept="image/*">
            <br>
            <img id="photoPreview">
        </div>
        
        <div id="uniformButtons">
            <h2>Шаг 2: Выберите одежду</h2>
            <button onclick="tryOnUniform('medical_coat')">🥼 Медицинский халат</button>
            <button onclick="tryOnUniform('medical_top')">👔 Медицинский верх</button>
            <button onclick="tryOnUniform('medical_pants')">👖 Медицинские брюки</button>
        </div>
        
        <div id="result">
            <h2>Результат примерки</h2>
            <canvas id="resultCanvas"></canvas>
            <br>
            <button onclick="savePhoto()">💾 Сохранить фото</button>
            <button onclick="resetApp()">🔄 Начать заново</button>
        </div>
    </div>
    
    <script>
        let userPhoto = null;
        let currentUniform = '';

        document.getElementById('photoInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            
            if (!file) return;
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                userPhoto = new Image();
                userPhoto.src = e.target.result;
                
                userPhoto.onload = function() {
                    const preview = document.getElementById('photoPreview');
                    preview.src = userPhoto.src;
                    preview.style.display = 'block';
                    
                    document.getElementById('uniformButtons').style.display = 'block';
                    document.getElementById('result').style.display = 'none';
                };
            };
            
            reader.readAsDataURL(file);
        });

        function tryOnUniform(type) {
            if (!userPhoto) {
                alert('Сначала загрузите фото!');
                return;
            }
            
            currentUniform = type;
            
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = userPhoto.width;
            canvas.height = userPhoto.height;
            
            ctx.drawImage(userPhoto, 0, 0);
            
            drawMedicalClothing(ctx, type);
            
            document.getElementById('result').style.display = 'block';
        }

        function drawMedicalClothing(ctx, type) {
            const canvas = document.getElementById('resultCanvas');
            const width = canvas.width;
            const height = canvas.height;
            
            if (type === 'medical_coat') {
                drawCoat(ctx, width, height);
            } else if (type === 'medical_top') {
                drawTop(ctx, width, height);
            } else if (type === 'medical_pants') {
                drawPants(ctx, width, height);
            }
        }

        function drawCoat(ctx, width, height) {
            const w = width * 0.55;
            const x = (width - w) / 2;
            const y = height * 0.20;
            const h = height * 0.55;
            
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(x, y, w, h);
            
            ctx.fillStyle = '#F0F0F0';
            ctx.fillRect(x + w * 0.05, y, w * 0.1, h);
            ctx.fillRect(x + w * 0.85, y, w * 0.1, h);
            
            ctx.fillStyle = '#E8E8E8';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.30, y);
            ctx.lineTo(x + w * 0.50, y + h * 0.10);
            ctx.lineTo(x + w * 0.70, y);
            ctx.lineTo(x + w * 0.50, y + h * 0.05);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#F5F5F5';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.30, y);
            ctx.lineTo(x + w * 0.38, y + h * 0.35);
            ctx.lineTo(x + w * 0.50, y + h * 0.10);
            ctx.closePath();
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(x + w * 0.70, y);
            ctx.lineTo(x + w * 0.62, y + h * 0.35);
            ctx.lineTo(x + w * 0.50, y + h * 0.10);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#CCCCCC';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h * (0.18 + i * 0.15), 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#999';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(x, y + h * 0.70, w, 10);
            
            ctx.strokeStyle = '#D0D0D0';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + w * 0.12, y + h * 0.40, w * 0.22, h * 0.16);
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Медицинский халат', width / 2, y + h + 40);
        }

        function drawTop(ctx, width, height) {
            const w = width * 0.50;
            const x = (width - w) / 2;
            const y = height * 0.22;
            const h = height * 0.35;
            
            ctx.fillStyle = '#E8F4FD';
            ctx.fillRect(x, y, w, h);
            
            ctx.fillStyle = '#D0E8F8';
            ctx.fillRect(x + w * 0.05, y, w * 0.1, h);
            ctx.fillRect(x + w * 0.85, y, w * 0.1, h);
            
            ctx.fillStyle = '#B8D8F0';
            ctx.beginPath();
            ctx.moveTo(x + w * 0.35, y);
            ctx.lineTo(x + w * 0.50, y + h * 0.20);
            ctx.lineTo(x + w * 0.65, y);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = '#E8F4FD';
            ctx.fillRect(x - w * 0.10, y, w * 0.18, h * 0.25);
            ctx.fillRect(x + w * 0.92, y, w * 0.18, h * 0.25);
            
            ctx.fillStyle = '#FFFFFF';
            for (let i = 0; i < 2; i++) {
                ctx.beginPath();
                ctx.arc(x + w / 2, y + h * (0.30 + i * 0.20), 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#B0D0E8';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            ctx.strokeStyle = '#B0D0E8';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + w * 0.15, y + h * 0.45, w * 0.20, h * 0.18);
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Медицинский верх', width / 2, y + h + 40);
        }

        function drawPants(ctx, width, height) {
            const w = width * 0.35;
            const x = (width - w) / 2;
            const y = height * 0.45;
            const h = height * 0.50;
            
            ctx.fillStyle = '#E8F4FD';
            ctx.fillRect(x - w * 0.25, y, w * 0.55, h);
            
            ctx.fillStyle = '#E8F4FD';
            ctx.fillRect(x + w * 0.70, y, w * 0.55, h);
            
            ctx.fillStyle = '#D0E8F8';
            ctx.fillRect(x - w * 0.25, y, w * 0.15, h);
            ctx.fillRect(x + w * 0.70, y, w * 0.15, h);
            
            ctx.fillStyle = '#B8D8F0';
            ctx.fillRect(x - w * 0.25, y, w * 1.50, h * 0.08);
            
            ctx.fillStyle = '#333';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Медицинские брюки', width / 2, y + h + 40);
        }

        function savePhoto() {
            const canvas = document.getElementById('resultCanvas');
            const link = document.createElement('a');
            link.download = 'candas_uniform.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function resetApp() {
            userPhoto = null;
            currentUniform = '';
            
            document.getElementById('photoInput').value = '';
            document.getElementById('photoPreview').style.display = 'none';
            document.getElementById('uniformButtons').style.display = 'none';
            document.getElementById('result').style.display = 'none';
        }
    </script>
</body>
</html>
